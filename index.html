<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroMatch</title>
    <style>
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #f7f7f5;
        color: #171717;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 520px);
        padding: 28px;
        border: 1px solid #deded9;
        background: #ffffff;
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 16px;
        color: #696969;
        line-height: 1.55;
      }

      code {
        padding: 2px 5px;
        background: #efefec;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MicroMatch</h1>
      <p>The app now runs with separate frontend and backend layers.</p>
      <p>Start it with <code>npm start</code>, then open <code>http://localhost:4173</code>.</p>
    </main>
  </body>
</html>
