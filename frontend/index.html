<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroMatch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true">
      <symbol id="icon-logo" viewBox="0 0 24 24">
        <path d="M12 21s-7-4.4-9.1-8.3C1.4 9.9 2.4 6.7 5.1 5.5c1.7-.8 3.8-.4 5.1 1l1.8 1.9 1.8-1.9c1.4-1.4 3.4-1.8 5.1-1 2.7 1.2 3.7 4.4 2.2 7.2C19 16.6 12 21 12 21Z" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <path d="m21 21-4.3-4.3" />
        <circle cx="11" cy="11" r="7" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 10h18" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m20 6-11 11-5-5" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <path d="M20 21a8 8 0 0 0-16 0" />
        <circle cx="12" cy="7" r="4" />
      </symbol>
      <symbol id="icon-building" viewBox="0 0 24 24">
        <path d="M4 21V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v16" />
        <path d="M8 7h1M12 7h1M8 11h1M12 11h1M8 15h1M12 15h1M3 21h18" />
      </symbol>
    </svg>

    <main id="authView" class="auth-shell"></main>

    <div id="appView" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand-row">
          <span class="brand-mark small"><svg><use href="#icon-logo"></use></svg></span>
          <div>
            <p class="label">MicroMatch</p>
            <strong id="workspaceName">Workspace</strong>
          </div>
        </div>

        <nav id="appNav" class="app-nav" aria-label="Primary navigation"></nav>

        <div class="account-menu">
          <span id="signedInAs"></span>
          <button id="signOutButton" class="ghost-action" type="button">Sign out</button>
        </div>
      </header>

      <main class="app-layout">
        <aside class="sidebar">
          <section id="profilePanel" class="panel"></section>
          <section id="sidebarPanel" class="panel"></section>
        </aside>

        <section class="workspace">
          <div class="workspace-header">
            <div>
              <p id="pageKicker" class="label">Workspace</p>
              <h2 id="pageTitle">Dashboard</h2>
              <p id="pageSubtitle" class="muted"></p>
            </div>
            <div id="metricStrip" class="metric-strip"></div>
          </div>
          <div id="mainContent"></div>
        </section>

        <aside class="right-rail">
          <section class="panel">
            <div class="panel-heading">
              <svg><use href="#icon-bell"></use></svg>
              <h3>Notifications</h3>
            </div>
            <div id="notificationList" class="stack small"></div>
          </section>
          <section id="upcomingPanel" class="panel"></section>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
